name: Update datasheet

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Regenerate data.json
        run: uv run tensorx-datasheet.py --output data.json --prefix ""

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: update data.json [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to data.json"
          fi
